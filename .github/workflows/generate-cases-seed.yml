name: Generate cases seed

on:
  push:
    branches:
      - develop/game-db
    paths:
      - 'src/data/cases.ts'
      - 'src/data/casesExpansion.ts'
      - 'src/lib/caseRules.ts'
      - 'scripts/generateCasesSeed.ts'
      - '.github/workflows/generate-cases-seed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: develop/game-db

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate cases SQL migration
        run: npm run db:generate-cases-seed

      - name: Commit generated migration
        run: |
          if git diff --quiet -- supabase/migrations/20260901030100_seed_legacy_cases.sql; then
            echo "Seed migration already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260901030100_seed_legacy_cases.sql
          git commit -m "chore: regenerate legal cases seed"
          git push origin HEAD:develop/game-db
